name: Update 3D commit chart

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:           # "Run workflow" button
  push:
    paths:
      - ".github/scripts/commit_gif.py"
      - ".github/workflows/commit-chart.yml"

permissions:
  contents: write

concurrency:
  group: commit-chart
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pillow
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate GIFs from real contributions
        env:
          # Add a token named GH_PAT (scope read:user) to include private-repo contributions
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python .github/scripts/commit_gif.py --user "${{ github.repository_owner }}" --dark --out "$RUNNER_TEMP/out/commits-dark.gif"
          python .github/scripts/commit_gif.py --user "${{ github.repository_owner }}" --out "$RUNNER_TEMP/out/commits.gif"

      - name: Publish GIFs to the chart-assets branch (single commit, no history)
        env:
          PUSH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          OUT="$RUNNER_TEMP/out"

          # Skip if nothing changed since the last publish
          if git ls-remote --exit-code --heads origin chart-assets >/dev/null 2>&1; then
            git fetch --depth 1 origin chart-assets
            same=1
            for f in commits.gif commits-dark.gif; do
              git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/old-$f" 2>/dev/null || same=0
              cmp -s "$RUNNER_TEMP/old-$f" "$OUT/$f" || same=0
            done
            if [ "$same" = "1" ]; then echo "No change in contributions"; exit 0; fi
          fi

          # Build a brand-new one-commit branch and force-push it (old copies are dropped)
          PUB="$RUNNER_TEMP/pub"; rm -rf "$PUB"; mkdir -p "$PUB"; cd "$PUB"
          git init -q -b chart-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$OUT/commits.gif" "$OUT/commits-dark.gif" .
          git add commits.gif commits-dark.gif
          git commit -q -m "Update 3D commit chart"
          git remote add origin "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"
          git push --force origin chart-assets
