name: Update 3D commit chart

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:           # "Run workflow" button
  push:
    paths:
      - ".github/scripts/commit_gif.py"

permissions:
  contents: write

concurrency:
  group: commit-chart
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pillow
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate GIFs and stats from real contributions
        env:
          # Optional: add a PAT named GH_PAT (scope read:user) to include private contributions
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python .github/scripts/commit_gif.py --user "${{ github.repository_owner }}" --stats-md stats.md --dark --out assets/commits-dark.gif
          python .github/scripts/commit_gif.py --user "${{ github.repository_owner }}" --out assets/commits.gif

      - name: Update stats block in README
        run: |
          python - <<'PY'
          import re
          r = open("README.md", encoding="utf-8").read()
          s = open("stats.md", encoding="utf-8").read().strip()
          r = re.sub(r"<!--STATS_START-->.*?<!--STATS_END-->", lambda m: s, r, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(r)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commits.gif assets/commits-dark.gif README.md
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Update 3D commit chart and stats"
          # main may have moved while we were generating: pull and retry
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed, retrying..."; sleep 5
          done
          exit 1
