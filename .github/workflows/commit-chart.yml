
name: Update 3D commit chart

on:
  # Refresh once every hour
  schedule:
    - cron: "17 * * * *"

  # Allow manual updates from GitHub Actions
  workflow_dispatch:

  # Update when you push normal changes to main
  push:
    branches:
      - main
    paths-ignore:
      - "assets/commits.gif"
      - "assets/commits-dark.gif"
      - "README.md"
      - "stats.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pillow
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate GIFs and statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python .github/scripts/commit_gif.py \
            --user "${{ github.repository_owner }}" \
            --stats-md stats.md \
            --dark \
            --out assets/commits-dark.gif

          python .github/scripts/commit_gif.py \
            --user "${{ github.repository_owner }}" \
            --out assets/commits.gif

      - name: Update README statistics
        run: |
          python - <<'PY'
          import re

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()

          with open("stats.md", encoding="utf-8") as f:
              stats = f.read().strip()

          updated = re.sub(
              r"<!--STATS_START-->.*?<!--STATS_END-->",
              lambda _: stats,
              readme,
              flags=re.S
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit and push updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/commits.gif assets/commits-dark.gif README.md

          if ! git diff --cached --quiet; then
            git commit -m "Update 3D commit chart and stats"
            git push
          fi
