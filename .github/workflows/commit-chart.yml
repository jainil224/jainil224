name: Update 3D GitHub activity chart

on:
  # GitHub may delay scheduled workflows; this is a periodic refresh, not instant live updating.
  schedule:
    - cron: "*/5 * * * *"

  # Allow a manual run from the Actions tab.
  workflow_dispatch:

  # Run when the chart generator or workflow itself changes on main.
  push:
    branches:
      - main
    paths:
      - ".github/scripts/commit_gif.py"
      - ".github/workflows/commit-chart.yml"

  # Comments made in issues/PRs in THIS repository can trigger a run.
  # Comments in other repositories are checked by the scheduled run instead.
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: github-activity-chart
  cancel-in-progress: true

jobs:
  build:
    # Only start an issue-comment run when the repository owner wrote the comment.
    if: github.event_name != 'issue_comment' || github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate GIFs and statistics
        env:
          # GH_PAT is recommended if your script needs broader account-level API access.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python .github/scripts/commit_gif.py \
            --user "${{ github.repository_owner }}" \
            --stats-md stats.md \
            --dark \
            --out assets/commits-dark.gif

          python .github/scripts/commit_gif.py \
            --user "${{ github.repository_owner }}" \
            --out assets/commits.gif

      - name: Update README statistics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme_path = Path("README.md")
          stats_path = Path("stats.md")

          if not readme_path.exists():
              raise SystemExit("README.md was not found at the repository root.")
          if not stats_path.exists():
              raise SystemExit("stats.md was not generated by commit_gif.py.")

          readme = readme_path.read_text(encoding="utf-8")
          stats = stats_path.read_text(encoding="utf-8").strip()
          pattern = r"<!--STATS_START-->.*?<!--STATS_END-->"

          if re.search(pattern, readme, flags=re.S):
              readme = re.sub(pattern, lambda _: stats, readme, flags=re.S)
              readme_path.write_text(readme, encoding="utf-8")
          else:
              print("Stats markers were not found in README.md; leaving README unchanged.")
          PY

      - name: Commit and push updated chart
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/commits.gif assets/commits-dark.gif README.md

          if git diff --cached --quiet; then
            echo "No chart or README changes to commit."
            exit 0
          fi

          git commit -m "Update 3D commit chart and stats"

          # Integrate commits pushed to main while the chart was being generated.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
