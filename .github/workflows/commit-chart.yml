
name: Update 3D GitHub activity chart

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/scripts/commit_gif.py"
      - ".github/workflows/commit-chart.yml"

  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write

concurrency:
  group: github-activity-chart
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'issue_comment' || github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pillow
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate GIFs and statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python .github/scripts/commit_gif.py \
            --user "${{ github.repository_owner }}" \
            --stats-md stats.md \
            --dark \
            --out assets/commits-dark.gif

          python .github/scripts/commit_gif.py \
            --user "${{ github.repository_owner }}" \
            --out assets/commits.gif

      - name: Update README statistics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import hashlib

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          stats_path = Path("stats.md")

          if stats_path.exists():
              stats = stats_path.read_text(encoding="utf-8").strip()
              readme = re.sub(
                  r"<!--STATS_START-->.*?<!--STATS_END-->",
                  lambda _: stats,
                  readme,
                  flags=re.S,
              )

          for filename in ("commits.gif", "commits-dark.gif"):
              digest = hashlib.sha256(
                  Path("assets", filename).read_bytes()
              ).hexdigest()[:12]

              pattern = re.compile(
                  r"(\./assets/" + re.escape(filename)
                  + r")(?:\?v=[^\"\s)>]*)?"
              )
              readme = pattern.sub(
                  lambda match: f"{match.group(1)}?v={digest}",
                  readme,
              )

          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Commit updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/commits.gif assets/commits-dark.gif README.md

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub activity chart"
            git push
          fi
