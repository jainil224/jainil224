name: Update 3D commit chart

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:           # "Run workflow" button
  push:
    paths:
      - ".github/scripts/commit_gif.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pillow
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate GIFs from real contributions
        env:
          # Optional: add a PAT named GH_PAT (scope read:user) to include private contributions
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python .github/scripts/commit_gif.py --user "${{ github.repository_owner }}" --dark --out assets/commits-dark.gif
          python .github/scripts/commit_gif.py --user "${{ github.repository_owner }}" --out assets/commits.gif

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commits.gif assets/commits-dark.gif
          git diff --cached --quiet || git commit -m "Update 3D commit chart"
          git push
